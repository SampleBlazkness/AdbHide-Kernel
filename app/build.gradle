plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blazkness.adbhide'
    compileSdk 36

    defaultConfig {
        applicationId "com.blazkness.adbhide"
        minSdk 26
        targetSdk 36
        versionCode 40
        versionName "1.4.0"
        multiDexEnabled false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            assets.srcDirs = ['assets']
            res.srcDirs = ['res']
        }
    }

    signingConfigs {
        ci {
            storeFile file("../ci/adbhide-ci.jks")
            storePassword "adbhide"
            keyAlias "adbhide"
            keyPassword "adbhide"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.ci
        }
    }
}

dependencies {
    compileOnly files('libs/xposed-stubs.jar')
}

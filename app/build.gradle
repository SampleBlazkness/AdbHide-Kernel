plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blazkness.adbhide'
    compileSdk 36

    defaultConfig {
        applicationId "com.blazkness.adbhide"
        minSdk 26
        targetSdk 36
        versionCode 31
        versionName "1.3.1"
        multiDexEnabled false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly files('libs/xposed-stubs.jar')
}

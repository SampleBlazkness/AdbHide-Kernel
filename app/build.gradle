plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blazkness.adbhide'
    compileSdk 36

    defaultConfig {
        applicationId "com.blazkness.adbhide"
        minSdk 26
        targetSdk 36
        versionCode 55
        versionName "1.4.15"
        multiDexEnabled false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            assets.srcDirs = ['assets']
            res.srcDirs = ['res']
        }
    }

    signingConfigs {
        releaseKey {
            def propFile = new File(System.getProperty("user.home"), ".android/adbhide-release.properties")
            if (propFile.exists()) {
                def props = new Properties()
                propFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.releaseKey.storeFile != null) {
                signingConfig signingConfigs.releaseKey
            }
        }
    }
}

dependencies {
    compileOnly files('libs/xposed-stubs.jar')
}
